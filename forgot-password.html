<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Reset Password</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="index.html" class="logo">CareConnect</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </header>

    <div class="container-sm">
        <div class="card">
            <h2 class="text-center">Reset Your Password</h2>
            <p class="text-center text-muted">
                Enter your registered email address and we will send you password reset instructions.
            </p>

            <form id="forgot-form" onsubmit="return resetPassword()" method="post">
                <div class="form-group">
                    <label for="email">Registered Email Address</label>
                    <input type="email" id="email" name="email" placeholder="name@example.com" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
            </form>

            <p class="text-center text-muted">
                Remember your password? <a href="login.html">Back to Login</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 CareConnect - AIUB Web Technologies Group 5</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
