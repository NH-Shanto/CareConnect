<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - User Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="index.html" class="logo">CareConnect</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html" class="active">Register</a></li>
        </ul>
    </header>

    <div class="container-sm">
        <div class="card">
            <h2 class="text-center">Create an Account</h2>

            <form id="register-form" onsubmit="return validateRegister()" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="abc@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="text" id="phone" name="phone" placeholder="01XXXXXXXXX" required>
                </div>

                <div class="form-group">
                    <label for="role">Register As</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="care-seeker">Care Seeker (Elderly / Differently-Abled)</option>
                        <option value="volunteer">Volunteer Helper</option>
                        <option value="doctor">Doctor</option>
                        <option value="guardian">Family Guardian</option>
                        <option value="provider">Food Provider</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">Living Address / Area</label>
                    <input type="text" id="address" name="address" placeholder="e.g. House 24, Road 7, Dhanmondi, Dhaka" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Create a password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Register Account</button>
            </form>

            <p class="text-center text-muted">
                Already have an account? <a href="login.html">Login here</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 CareConnect - AIUB Web Technologies Group 5</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
