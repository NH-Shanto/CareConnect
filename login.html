<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="index.html" class="logo">CareConnect</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="login.html" class="active">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </header>

    <div class="container-sm">
        <div class="card">
            <h2 class="text-center">Login to Your Account</h2>

            <form id="login-form" onsubmit="return validateLogin()" method="post">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" value="demo@careconnect.local" placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" value="password123" placeholder="Enter your password" required>
                </div>

                <div class="form-group">
                    <label for="role">User Role</label>
                    <select id="role" name="role" required>
                        <option value="">-- Select Role --</option>
                        <option value="care-seeker" selected >Care Seeker (Elderly / Differently-Abled)</option>
                        <option value="volunteer">Volunteer Helper</option>
                        <option value="doctor">Doctor</option>
                        <option value="guardian">Family Guardian</option>
                        <option value="provider">Food Provider</option>
                        <option value="admin">Administrator</option>
                    </select>
                </div>

                <div class="form-check">
                    <input type="checkbox" id="remember" name="remember" checked>
                    <label for="remember">Remember me on this computer</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="text-center text-muted">
                <a href="forgot-password.html">Forgot your password?</a>
            </p>
            <p class="text-center text-muted">
                Don't have an account? <a href="register.html">Register here</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 CareConnect - AIUB Web Technologies Group 5</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
