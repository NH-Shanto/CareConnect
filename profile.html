<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareConnect - My Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header -->
    <header class="navbar">
        <a href="index.html" class="logo">CareConnect</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="pages/care-seeker/dashboard.html">Dashboard</a></li>
            <li><a href="profile.html" class="active">Profile</a></li>
            <li><a href="login.html" onclick="return confirmLogout()">Logout</a></li>
        </ul>
    </header>

    <div class="container">
        <h1>User Profile & Settings</h1>
        <p class="text-muted">Manage your personal information, address, and emergency contact details.</p>

        <!-- Personal Info Card -->
        <div class="card">
            <h2>Personal Details</h2>

            <form id="profile-form" onsubmit="return saveProfile()" method="post">
                <div class="row">
                    <div class="col form-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" name="fullname" value="Abdul Rahman" required>
                    </div>
                    <div class="col form-group">
                        <label for="role">User Role</label>
                        <input type="text" id="role" name="role" value="Care Seeker" readonly>
                    </div>
                </div>

                <div class="row">
                    <div class="col form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" value="abdul.rahman@careconnect.local" required>
                    </div>
                    <div class="col form-group">
                        <label for="phone">Phone Number</label>
                        <input type="text" id="phone" name="phone" value="01711223344" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Home Address</label>
                    <input type="text" id="address" name="address" value="House 14, Road 5, Dhanmondi, Dhaka" required>
                </div>

                <div class="form-group">
                    <label for="emergency_contact">Emergency Contact (Family Guardian)</label>
                    <input type="text" id="emergency_contact" name="emergency_contact" value="Tariq Rahman (Son) - 01899887766" required>
                </div>

                <button type="submit" class="btn btn-primary">Save Profile Changes</button>
            </form>
        </div>

        <!-- Change Password Card -->
        <div class="card">
            <h2>Change Password</h2>

            <form id="password-form" onsubmit="return updatePassword()" method="post">
                <div class="form-group">
                    <label for="old_password">Current Password</label>
                    <input type="password" id="old_password" name="old_password" placeholder="Enter current password" required>
                </div>
                <div class="row">
                    <div class="col form-group">
                        <label for="new_password">New Password</label>
                        <input type="password" id="new_password" name="new_password" placeholder="Enter new password" required>
                    </div>
                    <div class="col form-group">
                        <label for="confirm_password">Confirm New Password</label>
                        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm new password" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-secondary">Update Password</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2026 CareConnect - AIUB Web Technologies Group 5</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/auth.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
